/* ---------------------- STATE (edition filter only) ---------------------- */
const STORAGE_KEY = 'botc-player-guide-edition';
const GOBLIN_KEY = 'botc-player-guide-goblin';
const AMNESIAC_KEY = 'botc-player-guide-amnesiac';
const SLEEPER_KEY = 'botc-player-guide-sleeperagent';
const MESMERIST_FLIP_KEY = 'botc-player-guide-mesmerist-flip';
const FAN_KEY_PREFIX = 'botc-player-guide-fan-'; // one localStorage key per fan role - see fanRolesEnabled below
const STARTED_KEY = 'botc-player-guide-started';
// Written only by a scanned/pasted Storyteller session link (see
// applySessionConfigFromString) - survives a reload so a player who
// re-opens the page later still sees tonight's locked pool, not a blank
// manual-toggle view.
const SESSION_LOCK_KEY = 'botc-player-guide-session-lock';
let edition = localStorage.getItem(STORAGE_KEY) || 'tb';
let houseRuleGoblin = localStorage.getItem(GOBLIN_KEY) === '1';
let houseRuleAmnesiac = localStorage.getItem(AMNESIAC_KEY) === '1';
let houseRuleSleeperAgent = localStorage.getItem(SLEEPER_KEY) === '1';
let mesmeristFlipConfirmed = localStorage.getItem(MESMERIST_FLIP_KEY) === '1';
// Per-role toggle, keyed by role id - e.g. {mesmerist:true} - replaces the old single includeFanRoles boolean.
let fanRolesEnabled = {};
ROLES.filter(r=>r.edition==='fan' && !r.disabled).forEach(r=>{
  fanRolesEnabled[r.id] = localStorage.getItem(FAN_KEY_PREFIX + r.id) === '1';
});
let gameStarted = localStorage.getItem(STARTED_KEY) === '1';
let activeTab = 'roles';
// Mirrors the Storyteller Tool's own state.manualPoolExclusions - the
// ACTUAL final stock-role knockout set from a scanned session link, which
// can differ from what ROLE_EXCLUDES would auto-derive from the toggle
// list alone (the Setup Wizard's Handpick/Random "replace" step can pick a
// different removal set than the automatic per-role cascade would have).
// Empty and inert for a normal, un-scanned device.
let sessionManualExclusions = new Set();
// True only once a Storyteller session link has been applied - hides the
// editable toggle grid entirely (a player scanning a QR code shouldn't be
// able to un-toggle the Storyteller's own choices) in favor of a read-only
// "locked by Storyteller" summary, distinct from the ordinary self-locked
// "Hide When Done Choosing" state.
let sessionLocked = false;

/* ---------------------- HELPERS ---------------------- */
function teamColor(team){ return TEAM_COLOR[team]||'var(--hairline)'; }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function highlightAbility(text){
  const escaped = escapeHtml(text);
  const phrases = ['each night except the first','once per game','each night','the first night','first night','the first time','no vote','immediately','instantly','once only','each day','may'];
  const pattern = new RegExp('\\b('+phrases.map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','ig');
  return escaped.replace(pattern, '<mark class="kw">$1</mark>');
}
// Fan roles being merged into an official edition's pool (via the
// "Include fan-made custom roles" toggle) should still respect a role's
// own excludeFrom list - a generic per-edition exclusion mechanism, unused
// by anything currently in ROLES but kept for a future role that genuinely
// doesn't fit a specific edition.
function fanRolesFor(ed){
  return ROLES.filter(r => r.edition==='fan' && !r.disabled && !(r.excludeFrom && r.excludeFrom.includes(ed)));
}
// Mirrors the Storyteller Tool's own mesmeristFlipReady() exactly - the
// Mesmerist is "too powerful" unless something in THIS game's actual
// script flips a player's true alignment mid-game (Pit-Hag/Barber being
// merely part of an SV/BMR script is no guarantee either will actually be
// assigned this time), so its availability is gated on either Sleeper
// Agent being on or the group's own manual confirmation, not the edition
// alone. Generalized as r.requiresAlignmentSwap for any future role with
// the same problem.
function mesmeristFlipReady(){
  return !!(houseRuleSleeperAgent || mesmeristFlipConfirmed);
}
function enabledFanRolesFor(ed){
  return fanRolesFor(ed).filter(r => fanRolesEnabled[r.id] && (!r.requiresAlignmentSwap || mesmeristFlipReady()));
}
function rolePool(){
  let pool = ROLES.filter(r => {
    if(r.id==='goblin' || r.id==='amnesiac' || r.id==='sleeperagent' || r.edition==='fan' || r.disabled) return false;
    return edition==='both' ? true : r.edition===edition;
  });
  const knockedOut = roleIdsKnockedOutByHouseRules();
  if(knockedOut.size) pool = pool.filter(r=>!knockedOut.has(r.id));
  if(houseRuleGoblin) pool.push(ROLE_MAP['goblin']);
  if(houseRuleAmnesiac) pool.push(ROLE_MAP['amnesiac']);
  if(houseRuleSleeperAgent) pool.push(ROLE_MAP['sleeperagent']);
  pool = pool.concat(enabledFanRolesFor(edition));
  return pool;
}

/* ---------------------- RENDER: HEADER ---------------------- */
function renderEdition(){
  const row = document.getElementById('editionRow');
  const opts = ['tb','sv','bmr','both'];
  row.innerHTML = opts.map(v=>{
    const info = EDITION_COLOR[v];
    return `<div class="chip-select ${edition===v?'active':''}" data-ed="${v}" style="--chip-color:${info.c};">${info.label}</div>`;
  }).join('');
  row.style.opacity = sessionLocked ? '.55' : '';
  row.style.pointerEvents = sessionLocked ? 'none' : '';
  row.querySelectorAll('.chip-select').forEach(el=>{
    el.onclick = ()=>{
      // A scanned Storyteller session link fixes the script along with the
      // rest of the pool - switching editions here would show roles the
      // Storyteller never included. Use "Not your session?" to back out.
      if(sessionLocked) return;
      edition = el.dataset.ed;
      localStorage.setItem(STORAGE_KEY, edition);
      renderEdition();
      renderRoleList();
    };
  });
}

// Short, deliberately vague taglines for the fan-role toggle boxes - full
// mechanical detail already lives in each role's own `ability`/fullInfo
// text on the Roles tab; this card is just "what kind of thing is this"
// at a glance.
const TOGGLE_ROLE_META = {
  goblin: {emoji:'🧌', blurb:'Wins instantly if executed right after opening their defense with the claim.'},
  amnesiac: {emoji:'🧠', blurb:'Secretly a real Townsfolk, without knowing it.'},
  sleeperagent: {emoji:'🕶️', blurb:'A dormant Minion identity, hidden even from them.'},
  mesmerist: {emoji:'🌀', blurb:'Learns a player\'s original alignment each night.'},
  maskedstranger: {emoji:'🎭', blurb:'May publicly reveal as someone else, once per game.'},
  puppetmaster: {emoji:'🎎', blurb:'Doubles the votes against a marked player\'s next nomination.'},
  nightwatchman: {emoji:'🔦', blurb:'May learn about the Demon after it strikes.'},
  scarecrow: {emoji:'🌾', blurb:'Counts as two players for headcount abilities.'},
  vintner: {emoji:'🍷', blurb:'Can quietly save a player from death.'},
  toxicologist: {emoji:'🧪', blurb:'Learns if either of two players is drunk or poisoned.'},
  exhumist: {emoji:'⚰️', blurb:'Learns a dead player\'s alignment — at their own risk.'},
  blackmailer: {emoji:'🗞️', blurb:'Forces one player to vote for another, or they die.'},
  ritualist: {emoji:'🕯️', blurb:'Can hex the Demon into missing, then redirect its kill.'},
};
function toggleRoleItems(){
  return [
    {role: ROLE_MAP['goblin'], on: houseRuleGoblin},
    {role: ROLE_MAP['amnesiac'], on: houseRuleAmnesiac},
    {role: ROLE_MAP['sleeperagent'], on: houseRuleSleeperAgent},
  ].concat(fanRolesFor(edition).map(r=>({role: r, on: !!fanRolesEnabled[r.id]})));
}
// Mirrors the Storyteller Tool's own ROLE_EXCLUDES exactly - see its
// comment there for the full rationale. Turning one of these ON knocks a
// STOCK (official TB/SV/BMR) role OUT of the available pool, one-
// directionally - the stock role has no toggle of its own to flip back, it
// simply becomes available again once the excluding toggle turns back off.
// Both apps need identical pairs, or a Storyteller running one and players
// following along on the other would see different pools.
const ROLE_EXCLUDES = {
  goblin: ['saint'],
  sleeperagent: ['baron','saint'],
  amnesiac: ['drunk'],
  maskedstranger: ['recluse'],
  mesmerist: ['empath'],
  exhumist: ['undertaker'],
  puppetmaster: ['witch'],
  blackmailer: ['cerenovus'],
  ritualist: ['exorcist'],
  nightwatchman: ['sage'],
  vintner: ['monk'],
  scarecrow: ['chef'],
  toxicologist: ['investigator'],
};
function isRoleToggleOn(rid){
  if(rid==='goblin') return houseRuleGoblin;
  if(rid==='amnesiac') return houseRuleAmnesiac;
  if(rid==='sleeperagent') return houseRuleSleeperAgent;
  return !!fanRolesEnabled[rid];
}
// Single place that flips one toggle's underlying variable and persists it
// to localStorage - the grid's own per-row click, Select All/None, and the
// exclusion cascade below all funnel through this.
function setHouseRoleToggle(rid, on){
  if(rid==='goblin'){ houseRuleGoblin = on; localStorage.setItem(GOBLIN_KEY, on ? '1' : '0'); }
  else if(rid==='amnesiac'){ houseRuleAmnesiac = on; localStorage.setItem(AMNESIAC_KEY, on ? '1' : '0'); }
  else if(rid==='sleeperagent'){ houseRuleSleeperAgent = on; localStorage.setItem(SLEEPER_KEY, on ? '1' : '0'); }
  else { fanRolesEnabled[rid] = on; localStorage.setItem(FAN_KEY_PREFIX + rid, on ? '1' : '0'); }
}
function roleIdsKnockedOutByHouseRules(){
  const out = new Set();
  Object.keys(ROLE_EXCLUDES).forEach(rid=>{
    if(isRoleToggleOn(rid)) ROLE_EXCLUDES[rid].forEach(x=>{ if(!TOGGLE_ROLE_META[x]) out.add(x); });
  });
  // Mirrors the Storyteller Tool's own manualPoolExclusions union - see
  // sessionManualExclusions above for why this can't just be re-derived
  // from the toggle list.
  sessionManualExclusions.forEach(x=>out.add(x));
  return out;
}

/* ---------------------- STORYTELLER SESSION LOCK ---------------------- */
// Decodes a "#s=<base64url>" link generated by the Storyteller Tool's own
// buildSessionConfigString - MUST stay byte-for-byte compatible with that
// encoding (edition + which toggle roles are on + the final knocked-out
// stock role ids + the Mesmerist alignment-swap confirmation flag), or a
// scanned QR code will silently show the wrong pool.
function applySessionConfigFromString(encoded){
  try{
    const b64 = encoded.replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(escape(atob(b64)));
    const cfg = JSON.parse(json);
    if(!cfg || typeof cfg!=='object') return false;
    edition = ['tb','sv','bmr','both'].includes(cfg.e) ? cfg.e : edition;
    localStorage.setItem(STORAGE_KEY, edition);
    Object.keys(TOGGLE_ROLE_META).forEach(id=> setHouseRoleToggle(id, false));
    (Array.isArray(cfg.h) ? cfg.h : []).forEach(id=>{ if(TOGGLE_ROLE_META[id]) setHouseRoleToggle(id, true); });
    mesmeristFlipConfirmed = !!cfg.f;
    localStorage.setItem(MESMERIST_FLIP_KEY, mesmeristFlipConfirmed ? '1' : '0');
    sessionManualExclusions = new Set(Array.isArray(cfg.x) ? cfg.x : []);
    sessionLocked = true;
    gameStarted = true;
    localStorage.setItem(STARTED_KEY, '1');
    localStorage.setItem(SESSION_LOCK_KEY, encoded);
    return true;
  } catch(e){
    return false;
  }
}
// Checked once at load, before the first render: a fresh scan in the URL
// takes priority (a player re-scanning a new QR should always win over
// whatever an old session left behind); otherwise fall back to whatever
// session lock was last saved, so a page refresh mid-game doesn't dump the
// player back into an unlocked, unfamiliar toggle grid.
function loadSessionLockOnInit(){
  const m = location.hash.match(/[#&]s=([^&]+)/);
  if(m && applySessionConfigFromString(m[1])) return;
  const saved = localStorage.getItem(SESSION_LOCK_KEY);
  if(saved) applySessionConfigFromString(saved);
}
function applyExclusionCascade(rid){
  (ROLE_EXCLUDES[rid] || []).forEach(excludedId=>{
    if(TOGGLE_ROLE_META[excludedId] && isRoleToggleOn(excludedId)) setHouseRoleToggle(excludedId, false);
  });
}
function renderHouseRuleCard(){
  const el = document.getElementById('houseRuleCard');
  const items = toggleRoleItems();

  if(gameStarted){
    const onNames = items.filter(i=>i.on).map(i=>i.role.name);
    const summary = onNames.length ? onNames.join(', ') : 'None';
    // A scanned Storyteller session link gets a read-only summary with no
    // Edit button - letting a player toggle their own roles back in would
    // defeat the whole point of a locked, ST-controlled pool. They can
    // still back out entirely via "Not your session?" if they scanned the
    // wrong code.
    el.innerHTML = sessionLocked ? `
      <div class="hr-locked">
        <span>🔒📡 Locked by Storyteller — ${summary}</span>
        <span class="hr-exit-lock" id="hrExitLock">Not your session?</span>
      </div>
    ` : `
      <div class="hr-locked">
        <span>🔒 Tonight — ${summary}</span>
        <button id="hrEdit">Edit</button>
      </div>
    `;
    if(sessionLocked){
      document.getElementById('hrExitLock').onclick = ()=>{
        sessionLocked = false;
        sessionManualExclusions = new Set();
        gameStarted = false;
        localStorage.removeItem(SESSION_LOCK_KEY);
        localStorage.setItem(STARTED_KEY, '0');
        renderEdition();
        renderHouseRuleCard();
        renderRoleList();
      };
    } else {
      document.getElementById('hrEdit').onclick = ()=>{
        gameStarted = false;
        localStorage.setItem(STARTED_KEY, '0');
        renderHouseRuleCard();
      };
    }
    return;
  }

  el.innerHTML = `
    <div class="bulk-row">
      <button class="bulk-btn" id="hrSelectAll">Select All</button>
      <button class="bulk-btn" id="hrSelectNone">Select None</button>
    </div>
    <div class="hr-grid">${items.map(item=>{
    const r = item.role;
    const c = teamColor(r.team);
    const meta = TOGGLE_ROLE_META[r.id] || {};
    const locked = r.requiresAlignmentSwap && !mesmeristFlipReady();
    const flipNote = r.requiresAlignmentSwap ? (
      houseRuleSleeperAgent
        ? `<div class="hr-mesmerist-flip on">✓ Unlocked by Sleeper Agent</div>`
        : `<label class="hr-mesmerist-flip"><input type="checkbox" data-mesmerist-flip ${mesmeristFlipConfirmed?'checked':''}> Alignment-swap mechanic (Pit-Hag/Barber/etc.) confirmed in this game's script</label>`
    ) : '';
    return `<div class="hr-mini ${item.on?'on':''} ${locked?'locked':''}" style="border-color:${c};">
      <div class="hr-mini-top">
        <span class="hr-mini-emoji">${meta.emoji||''}</span>
        <span class="hr-mini-name">${r.name}</span>
        <div class="hr-mini-switch ${item.on?'on':''} ${locked?'disabled':''}" data-toggle-role="${r.id}" style="${item.on?'background:'+c+'; border-color:'+c+';':''}"><div class="knob"></div></div>
      </div>
      <div class="hr-mini-desc">${meta.blurb||''}</div>
      ${flipNote}
    </div>`;
  }).join('')}</div>
    <button class="hr-start-btn" id="hrStart">✅ Hide When Done Choosing</button>
  `;
  el.querySelectorAll('[data-toggle-role]').forEach(sw=>{
    sw.onclick = ()=>{
      const rid = sw.dataset.toggleRole;
      const role = ROLE_MAP[rid];
      if(role.requiresAlignmentSwap && !isRoleToggleOn(rid) && !mesmeristFlipReady()) return;
      const turningOn = !isRoleToggleOn(rid);
      setHouseRoleToggle(rid, turningOn);
      if(turningOn) applyExclusionCascade(rid);
      renderHouseRuleCard();
      renderRoleList();
    };
  });
  const flipCb = el.querySelector('[data-mesmerist-flip]');
  if(flipCb){
    flipCb.onclick = ()=>{
      mesmeristFlipConfirmed = flipCb.checked;
      localStorage.setItem(MESMERIST_FLIP_KEY, mesmeristFlipConfirmed ? '1' : '0');
      if(!mesmeristFlipReady() && isRoleToggleOn('mesmerist')) setHouseRoleToggle('mesmerist', false);
      renderHouseRuleCard();
      renderRoleList();
    };
  }
  document.getElementById('hrSelectAll').onclick = ()=>{
    // Deliberately the "absolute chaos" option - see the Storyteller Tool's
    // own comment on its matching button for the full rationale.
    items.forEach(item=>{
      if(item.role.requiresAlignmentSwap && !mesmeristFlipReady()) return;
      if(!isRoleToggleOn(item.role.id)){
        setHouseRoleToggle(item.role.id, true);
        applyExclusionCascade(item.role.id);
      }
    });
    renderHouseRuleCard();
    renderRoleList();
  };
  document.getElementById('hrSelectNone').onclick = ()=>{
    items.forEach(item=>{ if(isRoleToggleOn(item.role.id)) setHouseRoleToggle(item.role.id, false); });
    renderHouseRuleCard();
    renderRoleList();
  };
  document.getElementById('hrStart').onclick = ()=>{
    gameStarted = true;
    localStorage.setItem(STARTED_KEY, '1');
    renderHouseRuleCard();
  };
}

document.getElementById('tabRoles').onclick = ()=>{
  activeTab='roles';
  document.getElementById('tabRoles').classList.add('active');
  document.getElementById('tabGlossary').classList.remove('active');
  document.getElementById('rolesView').style.display='';
  document.getElementById('glossaryView').style.display='none';
};
document.getElementById('tabGlossary').onclick = ()=>{
  activeTab='glossary';
  document.getElementById('tabGlossary').classList.add('active');
  document.getElementById('tabRoles').classList.remove('active');
  document.getElementById('glossaryView').style.display='';
  document.getElementById('rolesView').style.display='none';
};

/* ---------------------- RENDER: ROLE LIST ---------------------- */
function renderRoleList(){
  const list = document.getElementById('roleList');
  const query = (document.getElementById('roleSearch').value||'').trim().toLowerCase();
  const pool = rolePool().filter(r => !query || r.name.toLowerCase().includes(query));
  const teams = ['townsfolk','outsider','minion','demon'];
  const showEditionBadge = edition==='both';
  let html = '';
  teams.forEach(team=>{
    const items = pool.filter(r=>r.team===team);
    if(!items.length) return;
    html += `<div class="team-group-title" style="color:${teamColor(team)}">${TEAM_LABEL[team]}</div>`;
    html += items.map(r=>{
      const edBadge = (showEditionBadge && r.edition!=='house' && r.edition!=='fan' && EDITION_COLOR[r.edition])
        ? `<span class="ed-badge" style="background:${EDITION_COLOR[r.edition].c};">${EDITION_COLOR[r.edition].label}</span>` : '';
      return `
      <div class="role-row" data-role="${r.id}">
        <div class="swatch" style="background:${teamColor(r.team)}"></div>
        <div class="rtext">
          <div class="rname">${r.name}${edBadge}${roleBadgeHtml(r)}</div>
          <div class="rpreview">${r.ability}</div>
        </div>
        <div class="chev">›</div>
      </div>
    `;}).join('');
  });
  if(!html){
    html = `<div class="empty-note">No roles match "${escapeHtml(query)}".</div>`;
  }
  list.innerHTML = html;
  list.querySelectorAll('[data-role]').forEach(row=>{
    row.onclick = ()=> openRoleReveal(row.dataset.role);
  });
}
document.getElementById('roleSearch').addEventListener('input', renderRoleList);

/* ---------------------- RENDER: GLOSSARY ---------------------- */
function renderGlossary(){
  const list = document.getElementById('glossaryList');
  const cats = [...new Set(GLOSSARY.map(g=>g.cat))];
  list.innerHTML = cats.map(cat=>{
    const items = GLOSSARY.filter(g=>g.cat===cat);
    return `<div class="gloss-group-title">${cat}</div>` + items.map(g=>`
      <div class="gloss-card">
        <div class="term">${escapeHtml(g.term)}</div>
        <p>${escapeHtml(g.text)}</p>
      </div>
    `).join('');
  }).join('');
}

/* ---------------------- FULLSCREEN ROLE REVEAL ---------------------- */
function openRoleReveal(roleId){
  const role = ROLE_MAP[roleId];
  const root = document.getElementById('modalRoot');
  let mode = 'short'; // 'short' | 'full'

  function draw(){
    const text = mode==='full' ? role.fullInfo : role.ability;
    root.innerHTML = `
      <div class="present-overlay" id="ovReveal">
        <div class="present-top">
          <div class="info-tabs">
            <div class="info-tab ${mode==='short'?'active':''}" data-mode="short">Short</div>
            <div class="info-tab ${mode==='full'?'active':''}" data-mode="full">Full Info</div>
          </div>
          <button class="present-close" id="closeReveal">&times;</button>
        </div>
        <div class="present-content">
          <div class="p-team" style="color:${teamColor(role.team)}">${TEAM_LABEL[role.team]}</div>
          <div class="p-role">${role.name}${roleBadgeHtml(role, 'font-size:11px; vertical-align:middle;')}</div>
          <div class="p-msg">${highlightAbility(text)}</div>
        </div>
        <div class="present-bottom"><button id="backToList">Back to list</button></div>
      </div>
    `;
    document.getElementById('closeReveal').onclick = closeReveal;
    document.getElementById('backToList').onclick = closeReveal;
    root.querySelectorAll('[data-mode]').forEach(el=>{
      el.onclick = ()=>{ mode = el.dataset.mode; draw(); };
    });
  }
  draw();
}
function closeReveal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ---------------------- INIT ---------------------- */
loadSessionLockOnInit();
renderEdition();
renderHouseRuleCard();
renderRoleList();
renderGlossary();
</script>
